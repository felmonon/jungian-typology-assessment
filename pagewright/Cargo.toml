[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "vendor/wordcraft/crates/*"]
default-members = ["crates/*", "apps/*"]

# `workspace.package` is inherited by the vendored WordCraft engine crates (vendor/wordcraft), which
# keep upstream's version number and licence. Pagewright's own crates set their version explicitly.
[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"

[workspace.dependencies]
# Vendored WordCraft engine (upstream commit recorded in vendor/wordcraft/UPSTREAM.md).
wordcraft-geom = { path = "vendor/wordcraft/crates/geom" }
wordcraft-doc = { path = "vendor/wordcraft/crates/doc" }
wordcraft-fonts = { path = "vendor/wordcraft/crates/fonts" }
wordcraft-layout = { path = "vendor/wordcraft/crates/layout" }
wordcraft-docx = { path = "vendor/wordcraft/crates/docx" }
wordcraft-docbin = { path = "vendor/wordcraft/crates/docbin" }
wordcraft-formats = { path = "vendor/wordcraft/crates/formats" }
wordcraft-render = { path = "vendor/wordcraft/crates/render" }
wordcraft-pdf = { path = "vendor/wordcraft/crates/pdf" }
wordcraft-proof = { path = "vendor/wordcraft/crates/proof" }
wordcraft-engine = { path = "vendor/wordcraft/crates/engine" }
wordcraft-metafile = { path = "vendor/wordcraft/crates/metafile" }

# Pagewright
pagewright-core = { path = "crates/pagewright-core" }
pagewright-ui = { path = "crates/pagewright-ui" }

# foundation (versions as pinned by upstream WordCraft)
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
wuff = "0.2.9"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8", version = "=0.1.0", default-features = false, features = ["write"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
miniz_oxide = "0.8"
cfb = "0.15"
encoding_rs = "0.8"
chardetng = "1"
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Required by craft-pdf (as upstream): the backend rejects writers that failed during unwinding.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8" }
