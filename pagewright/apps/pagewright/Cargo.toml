[package]
name = "pagewright"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Pagewright desktop app"
default-run = "pagewright"

[lints]
workspace = true

[dependencies]
pagewright-core = { workspace = true }
pagewright-ui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { workspace = true }
rfd = { workspace = true }
# The system print spooler (CUPS on macOS/Linux, the Windows spooler), MIT OR Apache-2.0,
# pinned to the revision WordCraft uses.
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "d27646a5f7c8b4fc85d9dd3213b8c88b58e0088d" }
